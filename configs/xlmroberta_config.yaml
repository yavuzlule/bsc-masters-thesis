model:
  name: FacebookAI/xlm-mlm-en-2048
  type: transformers.XLMRobertaForSequenceClassification

  params:
    num_classes: 2
    max_length: 256
    batch_size: 8
    num_epochs: 10
    learning_rate: 1e-5

  optimizer: torch.optim.AdamW


data:
  raw_text_dir: "data/raw"
  interim_path: "data/interim"
  target_column: label
pipeline:
  run_preprocessing: true
  run_training: true

training:
  test_size: 0.2
  stratify: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

output:
  base_dir: results
  save_model: true

df: "/media/M2_disk/yavuz/bsc-masters-thesis/data/interim/2026-05-12_12-34-39/dataset.parquet"