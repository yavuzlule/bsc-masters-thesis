model:
  name: distilbert-base-uncased
  type: transformers.DistilBertForSequenceClassification
  dir: /media/M2_disk/yavuz/bsc-masters-thesis/results/distilbert-base-uncased_la/2026-06-28_19-49-01

  params:
    num_classes: 2
    max_length: 256
