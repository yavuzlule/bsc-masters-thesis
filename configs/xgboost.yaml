model:
  name: xgboost
  type: xgboost.XGBClassifier

  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: logloss
    random_state: 42
    n_jobs: -1

training:
  test_size: 0.2
  stratify: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

output:
  base_dir: results
  save_model: true

data:
  raw_text_dir: "data/raw"
  interim_path: "data/interim"
  target_column: label



