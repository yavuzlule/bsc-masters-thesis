model:
  name: bert-base-uncased
  type: transformers.BertForSequenceClassification
  dir: /media/M2_disk/yavuz/bsc-masters-thesis/results/bert-base-uncased_la/2026-06-28_19-55-26

  params:
    num_classes: 2
    max_length: 256
    batch_size: 16
    num_epochs: 1
    learning_rate: 1e-5

  optimizer: torch.optim.AdamW


training:
  test_size: 0.2
  stratify: true

  cross_validation:
    enabled: true
    n_splits: 5
    shuffle: true
    random_state: 42

output:
  base_dir: results
  save_model: true

df: "/data/processed/preprocessed_miriam_corpus_train.parquet"
#df: "data/processed/multilingual_test.parquet"