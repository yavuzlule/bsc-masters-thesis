data:
  interim_path: data/interim
  raw_text_dir: data/raw
  target_column: label
df: data/interim/chunked_256/2026-05-18_21-26-04/dataset.parquet
evaluation:
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
model:
  name: FacebookAI/xlm-mlm-en-2048
  optimizer: torch.optim.AdamW
  params:
    batch_size: 8
    learning_rate: 1e-5
    max_length: 256
    num_classes: 2
    num_epochs: 10
  type: transformers.XLMRobertaForSequenceClassification
output:
  base_dir: results
  save_model: true
pipeline:
  run_preprocessing: true
  run_training: true
training:
  stratify: true
  test_size: 0.2
